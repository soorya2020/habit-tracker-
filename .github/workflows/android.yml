name: Android build

# Checks the code and builds an installable APK on every push to main.
# Each build is published as a GitHub release, so the newest APK is always at
# https://github.com/soorya2020/habit-tracker-/releases/latest/download/one-percent-club.apk
# Once Firebase is set up, add the FIREBASE_APP_ID and
# FIREBASE_SERVICE_ACCOUNT secrets and each build also goes to testers
# through Firebase App Distribution.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --build-number ${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk one-percent-club.apk
      - uses: actions/upload-artifact@v5
        with:
          name: one-percent-club-apk
          path: one-percent-club.apk
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 1% Club build ${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          files: one-percent-club.apk
          make_latest: true
      - name: Send to testers
        if: github.event_name == 'push' && env.FIREBASE_APP_ID != ''
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: club
          file: one-percent-club.apk
