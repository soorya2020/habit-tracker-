name: Android build

# Checks the code and builds an installable APK on every push to main.
# Download it from the run's "Artifacts" section.
# Once Firebase is set up, add the FIREBASE_APP_ID and
# FIREBASE_SERVICE_ACCOUNT secrets and each build also goes to testers
# through Firebase App Distribution.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: one-percent-club-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Send to testers
        if: github.event_name == 'push' && env.FIREBASE_APP_ID != ''
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: club
          file: build/app/outputs/flutter-apk/app-release.apk
